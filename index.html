<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Factories</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f3ee;
    --surface: #ffffff;
    --border: #847d6c;
    --text: #1c1b18;
    --text-muted: #6b675e;
    --accent: #2f6f4f;
    --focus: #1a5c3a;
    --shadow: 0 1px 2px rgba(28, 27, 24, 0.06), 0 4px 12px rgba(28, 27, 24, 0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #201f22;
      --border: #777265;
      --text: #f4f3ef;
      --text-muted: #b7b3a8;
      --accent: #7fd4a6;
      --focus: #8fe0b3;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;
    line-height: 1.5;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1.25rem;
    color: var(--text);
    background: var(--bg);
  }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 2px;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 0.3rem;
  }

  p.lede {
    color: var(--text-muted);
    margin-top: 0;
    margin-bottom: 2.25rem;
    font-size: 1.02rem;
  }

  .cards {
    display: grid;
    gap: 1rem;
  }

  a.card {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    text-decoration: none;
    color: inherit;
    background: var(--surface);
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  @media (prefers-reduced-motion: reduce) {
    a.card {
      transition: none;
    }

    a.card:hover {
      transform: none;
    }
  }

  .card-icon {
    flex: 0 0 auto;
    width: 2.5rem;
    height: 2.5rem;
    color: var(--accent);
  }

  a.card h2 {
    margin: 0 0 0.3rem;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
  }

  a.card p {
    margin: 0;
    font-size: 0.94rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<h1>Puzzle Factories</h1>
<p class="lede">Two small daily-puzzle generators, each with its own certified-fair archive.</p>
<div class="cards">
  <a class="card" href="gridlock/">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="2"></rect>
      <path d="M3 9h18M3 15h18M9 3v18M15 3v18"></path>
    </svg>
    <span>
      <h2>Gridlock</h2>
      <p>A daily 5&times;5 mini crossword, generated fresh each day.</p>
    </span>
  </a>
  <a class="card" href="cellblock/">
    <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor" stroke="none"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor" stroke="none"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1"></rect>
    </svg>
    <span>
      <h2>Cellblock</h2>
      <p>A daily nonogram, certified solvable by logic alone &mdash; plus a hand-drawn picture gallery.</p>
    </span>
  </a>
</div>
</body>
</html>
