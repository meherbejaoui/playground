<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Factories</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #1c1b18;
    background: #f4f3ee;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 0.25rem;
  }
  p.lede {
    color: #6b675e;
    margin-top: 0;
    margin-bottom: 2rem;
  }
  .cards {
    display: grid;
    gap: 1rem;
  }
  a.card {
    display: block;
    padding: 1.25rem 1.5rem;
    border: 1px solid #c9c5ba;
    border-radius: 0.6rem;
    text-decoration: none;
    color: inherit;
    background: #ffffff;
  }
  a.card:hover {
    border-color: #2f6f4f;
  }
  a.card h2 {
    margin: 0 0 0.3rem;
    font-size: 1.15rem;
    color: #2f6f4f;
  }
  a.card p {
    margin: 0;
    font-size: 0.92rem;
    color: #6b675e;
  }
</style>
</head>
<body>
<h1>Puzzle Factories</h1>
<p class="lede">Two small daily-puzzle generators, each with its own certified-fair archive.</p>
<div class="cards">
  <a class="card" href="gridlock/">
    <h2>Gridlock</h2>
    <p>A daily 5&times;5 mini crossword, generated fresh each day.</p>
  </a>
  <a class="card" href="cellblock/">
    <h2>Cellblock</h2>
    <p>A daily nonogram, certified solvable by logic alone &mdash; plus a hand-drawn picture gallery.</p>
  </a>
</div>
</body>
</html>
