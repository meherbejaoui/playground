name: Gridlock CI

on:
  push:
    paths:
      - "gridlock/**"
      - ".github/workflows/gridlock-ci.yml"
  pull_request:
    paths:
      - "gridlock/**"
      - ".github/workflows/gridlock-ci.yml"

defaults:
  run:
    working-directory: gridlock

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install gridlock (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest

      - name: Run player-core tests
        run: node --test tests/player/*.test.mjs
